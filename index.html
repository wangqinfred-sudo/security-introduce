<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书安全功能总览</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="slant-cards-page">
    <div class="cards-container">
        <!-- 左侧卡片组 -->
        <div class="card-group left-group">
            <a href="account-security-detail.html" class="card-link">
                <div class="slant-card" id="card-account">
                    <div class="card-header">
                        <img src="account-security.svg" alt="账号安全" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">账号安全</div>
                            <div class="card-description">保障成员账号安全</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">SSO账号登录</div>
                        <div class="card-tag">登录方式管理</div>
                        <div class="card-tag">登录密码管理</div>
                        <div class="card-tag">两步验证</div>
                        <div class="card-tag">登录有效期设置</div>
                        <div class="card-tag">账号申诉管理</div>
                    </div>
                </div>
            </a>
            
            <a href="terminal-security-detail.html" class="card-link">
                <div class="slant-card left-group-middle" id="card-terminal">
                    <div class="card-header">
                        <img src="terminal-security.svg" alt="终端安全" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">终端安全</div>
                            <div class="card-description">保障终端设备安全</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">移动端文件加密</div>
                        <div class="card-tag">粘贴保护</div>
                        <div class="card-tag">截屏录屏保护</div>
                    </div>
                </div>
            </a>
            
            <a href="data-protection-detail.html" class="card-link">
                <div class="slant-card" id="card-data">
                    <div class="card-header">
                        <img src="data-protection.svg" alt="数据保护" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">数据保护</div>
                            <div class="card-description">全面保障数据安全</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">密级标签</div>
                        <div class="card-tag">水印设置</div>
                        <div class="card-tag">消息敏感词过滤</div>
                        <div class="card-tag">飞书DLP</div>
                    </div>
                </div>
            </a>
        </div>
        
        <!-- 中间飞书Logo区域 -->
        <div class="center-logo">
            <img src="feishu-logo.svg" alt="飞书安全" id="center-logo" class="center-logo-image">
        </div>
        
        <!-- 右侧卡片组 -->
        <div class="card-group right-group">
            <a href="access-security-detail.html" class="card-link">
                <div class="slant-card" id="card-access">
                    <div class="card-header">
                        <img src="access-security.svg" alt="访问安全" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">访问安全</div>
                            <div class="card-description">持续验证访问请求</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">访问策略管理</div>
                    </div>
                </div>
            </a>
            
            <a href="member-permissions-detail.html" class="card-link">
                <div class="slant-card right-group-middle" id="card-permissions">
                    <div class="card-header">
                        <img src="member-permissions.svg" alt="成员权限" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">成员权限</div>
                            <div class="card-description">灵活的权限管理能力</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">组织架构可见范围</div>
                        <div class="card-tag">名片字段可见范围</div>
                        <div class="card-tag">授权权限</div>
                        <div class="card-tag">沟通协作权限</div>
                        <div class="card-tag">对外沟通权限</div>
                        <div class="card-tag">云文档设置</div>
                        <div class="card-tag">文件操作权限</div>
                        <div class="card-tag">云文档权限默认值管理</div>
                    </div>
                </div>
            </a>
            
            <a href="log-audit-detail.html" class="card-link">
                <div class="slant-card" id="card-audit">
                    <div class="card-header">
                        <img src="log-audit.svg" alt="日志审计" class="svg-icon">
                        <div class="card-text-container">
                            <div class="card-title">日志审计</div>
                            <div class="card-description">完整记录操作日志</div>
                        </div>
                    </div>
                    <div class="card-tags">
                        <div class="card-tag">成员行为审计</div>
                        <div class="card-tag">管理员日志</div>
                        <div class="card-tag">OpenAPI日志</div>
                    </div>
                </div>
            </a>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
