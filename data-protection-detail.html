<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据保护介绍</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 全局样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #EBF1FF;
            color: #333;
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
        }
        
        /* 数据保护介绍页面特定样式 */
        .data-protection-container {
            max-width: 900px;
            margin: calc(var(--page-header-height) + 16px) auto 40px;
            width: calc(100% - 40px);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 20px !important;
            min-height: 700px;
        }
        
        .back-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-right: 8px;
            border-radius: 50%;
            background-color: transparent;
            color: #002A8F;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            vertical-align: middle;
        }
        .back-arrow img { width: 20px; height: 20px; vertical-align: middle; }
        .back-arrow svg { width: 20px; height: 20px; fill: none; }
        .back-arrow:hover { background-color: #f5f7fa; }
        
        .content-section { display: flex; gap: 20px; align-items: flex-start; }
        
        .text-content { flex: 1; max-width: 600px; }
        
        .main-title {
            font-size: 28px;
            font-weight: 600;
            color: #002A8F;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .description {
            font-size: 16px;
            line-height: 1.8;
            color: #646A73;
            margin-bottom: 20px;
        }
        
        .feature-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .feature-button {
            background-color: #f5f7fa;
            color: #333;
            border: 1px solid #e3e9f0;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.3s ease;
        }
        
        .feature-button:hover { background-color: #e3e9f0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
        
        /* 底部Tab区样式 */
        .tab-section { margin-top: 30px; }
        
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        
        /* Tab按钮样式 */
        .tab-button {
            background-color: rgba(31,35,41,0.10);
            color: #1F2329;
            border: none;
            height: 28px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            line-height: 28px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .tab-button:hover { background-color: rgba(31,35,41,0.06); color: #1F2329; }
        .tab-button.active { background-color: rgba(20, 86, 240, 0.2); color: #1456F0; }
        
        /* 图片容器基础样式 */
        .image-container {
            position: relative;
            width: 100%;
            max-height: 600px;
            margin: 0;
            background-color: #F2F3F5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        
        /* 为数据保护设置合适的宽高比（对齐账号安全页面写法） */
        #sub-content-classification-tag-employee .image-container,
        #sub-content-classification-tag-admin .image-container,
        #sub-content-watermark-employee .image-container,
        #sub-content-watermark-admin .image-container,
        #sub-content-feishu-dlp-employee .image-container,
        #sub-content-feishu-dlp-admin .image-container {
            aspect-ratio: 1.6/1;
        }
        
        .step-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin: 0;
        }
        
        .step-image.active { opacity: 1; }
        
        /* 热区容器 - 保持覆盖整个图片容器 */
        .hotspots-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* 热区样式 */
        .hotspot {
            position: absolute;
            width: clamp(44px, 6vw, 80px);
            height: clamp(44px, 6vw, 80px);
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            display: none;
            transform-origin: center center;
        }
        
        /* 使用伪元素实现脉冲效果，避免与transform冲突 */
        .hotspot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(0, 96, 255, 0.3);
            border: 2px solid rgba(0, 96, 255, 0.8);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        /* 脉冲动画 */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        
        /* 导航点样式 */
        .step-indicators {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
            gap: 15px;
            z-index: 10;
        }
        
        /* 管理员配置的导航点容器显示 */
        .admin-indicators { display: flex; }
        
        .step-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .step-indicator.active { background-color: #0060FF; }
        
        /* 确保h1和tabs之间的间距为20px */
        .main-title + .tab-section { margin-top: 20px !important; }
        
        /* 顶部区域样式 */
        .top-section { }
        
        /* 中间内容区样式 */
        .content-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px !important;
            background-color: #fff;
            border-radius: 12px;
            border: 1px solid #e3e9f0;
            overflow: visible;
        }
        
        /* 双因素验证图片容器 */
        .two-factor-images {
            position: relative;
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        
        /* 复用上方 .image-container / .step-image 样式，避免重复覆盖 */
        
        /* 热区容器 - 保持覆盖整个图片容器 */
        .hotspots-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* 热区样式 */
        .hotspot {
            position: absolute;

            height: clamp(44px, 6vw, 80px);
            border-radius: 50%;
            background: transparent;

            border: 2px solid rgba(0, 96, 255, 0.8);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        /* Tab内容样式 - 移除边框，避免与content-section的边框形成双层 */
        .content-section .tab-content {
            border: none;
            border-radius: 0;
        }
    </style>
</head>

            /* Tab内容样式 */

                width: 100%;
                height: auto;
                padding: 20px 20px 0 20px;
                box-sizing: border-box;
                text-align: center;
                background-color: #fff;
                /* 移除边框，避免与content-section的边框形成双层 */
                border-radius: 12px;
            }
            
            .tab-content.active {
                display: flex;
                flex-direction: column;
            }
            /* Tab内部标题和描述 */
            .tab-inner-title {
                font-size: 16px;
                font-weight: 600;
                color: #1F2329;
                margin-bottom: 6px;
                margin-top: 0;
                text-align: left;
            }
            
            .tab-inner-description {
                font-size: 14px;
                line-height: 1.6;
                color: #646A73;
                margin-bottom: 20px;
                margin-top: 0;
                text-align: left;
            }
            
            /* 小tab切换器样式 - 按钮容器 */
            .sub-tab-container {
                display: inline-flex;
                gap: 0;
                margin-bottom: 20px;
                margin-top: 0;
                background-color: #F3F4F6;
                border-radius: 6px;
                padding: 1px;
                overflow: hidden;
                width: max-content;
                height: 32px;
                align-items: center;
            }
            
            .sub-tab-button {
                background-color: transparent;
                color: #6B7280;
                border: none;
                padding: 0 12px;
                height: 32px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 400;
                line-height: 32px;
                transition: all 0.2s ease;
            }
            
            .sub-tab-button:hover { background-color: rgba(0,0,0,0.02); color: #4B5563; }
            
            .sub-tab-button.active {
                background-color: #FFFFFF;
                color: #1F2937;
                border: none;
                box-shadow: inset 0 0 0 1px #D1D5DB, 0 1px 2px rgba(0,0,0,0.04);
                border-radius: 6px;
            }
            
            /* 小tab内容样式 */
            .sub-tab-content {
                display: none;
                margin-bottom: 0;
            }
            
            .sub-tab-content.active { display: block; }
        </style>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = Array.from(document.querySelectorAll('.tab-button'));
            const tabContents = Array.from(document.querySelectorAll('.tab-content'));

            function setActiveStep(subContentEl, step) {
                if (!subContentEl) return;

                const stepContainer = subContentEl.querySelector('.two-factor-images');
                if (!stepContainer) return;

                const stepStr = String(step);

                const stepImages = stepContainer.querySelectorAll('.step-image');
                stepImages.forEach(img => {
                    img.classList.toggle('active', img.dataset.step === stepStr);
                });

                const allHotspots = stepContainer.querySelectorAll('.hotspot');
                allHotspots.forEach(hs => {
                    hs.style.display = hs.dataset.step === stepStr ? 'block' : 'none';
                });

                const stepIndicatorsWrap = subContentEl.querySelector('.step-indicators');
                if (stepIndicatorsWrap) {
                    const indicators = stepIndicatorsWrap.querySelectorAll('.step-indicator');
                    indicators.forEach(ind => {
                        ind.classList.toggle('active', ind.dataset.step === stepStr);
                    });
                }
            }

            function activateSubTab(tabContentEl, subTabId) {
                if (!tabContentEl) return;

                const buttons = Array.from(tabContentEl.querySelectorAll('.sub-tab-button'));
                const contents = Array.from(tabContentEl.querySelectorAll('.sub-tab-content'));

                buttons.forEach(b => b.classList.toggle('active', b.dataset.subTab === subTabId));
                contents.forEach(c => {
                    c.classList.toggle('active', c.id === `sub-content-${subTabId}`);
                    c.style.opacity = c.classList.contains('active') ? '1' : '0';
                });

                const activeSub = tabContentEl.querySelector(`#sub-content-${subTabId}`);
                setActiveStep(activeSub, '1');
            }

            function activateDefaultAdminSubTab(tabContentEl) {
                if (!tabContentEl) return;

                const buttons = Array.from(tabContentEl.querySelectorAll('.sub-tab-button'));
                if (buttons.length === 0) return;

                const adminBtn = buttons.find(b => (b.dataset.subTab || '').endsWith('-admin'));
                const targetBtn = adminBtn || buttons[0];
                activateSubTab(tabContentEl, targetBtn.dataset.subTab);
            }

            function activateMainTab(tabId) {
                tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
                tabContents.forEach(content => {
                    const isActive = content.id === `content-${tabId}`;
                    content.classList.toggle('active', isActive);
                    content.style.opacity = isActive ? '1' : '0';
                });

                const activeContent = document.getElementById(`content-${tabId}`);
                activateDefaultAdminSubTab(activeContent);
            }

            // 主 tab：切换时默认选中“管理员配置”
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!btn.dataset.tab) return;
                    activateMainTab(btn.dataset.tab);
                });
            });

            // 子 tab：仅作用于当前主 tab（避免全局互相影响）
            tabContents.forEach(tabContentEl => {
                const buttons = Array.from(tabContentEl.querySelectorAll('.sub-tab-button'));
                if (buttons.length === 0) return;

                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (!btn.dataset.subTab) return;
                        activateSubTab(tabContentEl, btn.dataset.subTab);
                    });
                });
            });

            // 热区点击切图（修复：hotspot 不在 image-container 内部）
            document.querySelectorAll('.hotspot').forEach(hotspot => {
                hotspot.addEventListener('click', () => {
                    const nextStep = hotspot.dataset.nextStep;
                    const subContentEl = hotspot.closest('.sub-tab-content');
                    if (!subContentEl || !nextStep) return;
                    setActiveStep(subContentEl, String(nextStep));
                });
            });

            // 步骤指示器点击切图
            document.querySelectorAll('.step-indicator').forEach(indicator => {
                indicator.addEventListener('click', () => {
                    const step = indicator.dataset.step;
                    const subContentEl = indicator.closest('.sub-tab-content');
                    if (!subContentEl || !step) return;
                    setActiveStep(subContentEl, String(step));
                });
            });

            // 初始化：保持当前 active 主 tab，默认激活管理员配置
            const defaultTabId = document.querySelector('.tab-button.active')?.dataset?.tab || tabButtons[0]?.dataset?.tab;
            if (defaultTabId) activateMainTab(defaultTabId);
        });
    </script>
<script src="process-end-popup.js"></script>
<script src="hotspot-debug.js"></script>
</body>
</html>
