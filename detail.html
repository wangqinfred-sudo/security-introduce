<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="styles.css">
    <style>
        /* 详情页面特定样式 */
        .detail-container {
            max-width: 800px;
            margin: calc(var(--page-header-height) + 16px) auto 40px;
            padding: 40px 20px;
            background-color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        .back-button {
            background-color: #f5f7fa;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }
        
        .back-button:hover {
            background-color: #e3e9f0;
        }
        
        .detail-title {
            font-size: 24px;
            font-weight: 600;
            color: #002A8F;
            margin-bottom: 20px;
        }
        
        .detail-content {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
        }
        
        /* 双图片布局容器 */
        .detail-image-container {
            width: 100%;
            height: 400px;
            background-color: #f5f7fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .detail-section {
            margin-bottom: 25px;
        }
        
        .detail-section h3 {
            font-size: 18px;
            font-weight: 600;
            color: #002A8F;
            margin-bottom: 10px;
        }
        
        .detail-section p {
            font-size: 14px;
            color: #546A9E;
            margin-bottom: 10px;
        }
        
        .feature-list {
            list-style-type: disc;
            margin-left: 20px;
            margin-bottom: 20px;
        }
        
        .feature-list li {
            font-size: 14px;
            color: #546A9E;
            margin-bottom: 5px;
        }
    </style>
</head>

    <div class="detail-container">

        <!-- 详情内容 -->

        </div>
        
        <!-- 双图片布局容器 -->

        </div>
        
        <!-- 功能特点 -->
        <div class="detail-section">

        // 页面加载完成后显示详情
        document.addEventListener('DOMContentLoaded', () => {
            // 获取功能名称参数
            const featureName = getURLParameter('feature');
            
            if (featureName && featureDetails[featureName]) {
                const detail = featureDetails[featureName];
                
                // 更新页面标题
                document.title = detail.title + " - 飞书安全功能详情";
                
                // 更新详情内容
                document.getElementById('detailTitle').textContent = detail.title;
                document.getElementById('detailContent').innerHTML = `<p>${detail.content}</p>`;
                
                // 更新功能特点列表
                const featureList = document.getElementById('featureList');
                featureList.innerHTML = '';
                detail.features.forEach(feature => {
                    const li = document.createElement('li');
                    li.textContent = feature;
                    featureList.appendChild(li);
                });
                
                // 更新应用场景
                document.getElementById('useCase').textContent = detail.useCase;
                
                // 加载双图片布局
                loadDualImages(featureName);
            } else {
                // 如果没有参数或参数无效，显示默认内容
                document.getElementById('detailTitle').textContent = "功能详情";
                document.getElementById('detailContent').innerHTML = `<p>请从安全功能总览页面选择一个功能查看详细内容。</p>`;
            }
        });
        
        // 加载双图片布局
        function loadDualImages(featureName) {
            const imageContainer = document.getElementById('imageContainer');
            
            // 创建双图片布局
            const dualImageHTML = `
                <div class="dual-image-container">
                    <div class="main-image-container">
                        <img src="${featureName}-step1.svg" alt="${featureName} 主图" class="main-image" onerror="this.style.display='none'">
                    </div>
                    <img src="${featureName}-step2.svg" alt="${featureName} 说明" class="overlay-image" onerror="this.style.display='none'">
                </div>
            `;
            
            imageContainer.innerHTML = dualImageHTML;
        }

</html>
