<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志审计介绍</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 全局样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #EBF1FF;
            color: #333;
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
        }
        
        /* 日志审计介绍页面特定样式 */
        .log-audit-container {
            max-width: 900px;
            margin: calc(var(--page-header-height) + 16px) auto 40px;
            width: calc(100% - 40px);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 20px !important;
            min-height: 700px;
        }
        
        .back-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-right: 8px;
            border-radius: 50%;
            background-color: transparent;
            color: #002A8F;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            vertical-align: middle;
        }
        .back-arrow img { width: 20px; height: 20px; vertical-align: middle; }
        .back-arrow svg { width: 20px; height: 20px; fill: none; }
        .back-arrow:hover { background-color: #f5f7fa; }
        
        .content-section { display: flex; gap: 20px; align-items: flex-start; }
        
        .text-content { flex: 1; max-width: 600px; }
        
        .main-title {
            font-size: 28px;
            font-weight: 600;
            color: #002A8F;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .description {
            font-size: 16px;
            line-height: 1.8;
            color: #646A73;
            margin-bottom: 20px;
        }
        
        .feature-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .feature-button {
            background-color: #f5f7fa;
            color: #333;
            border: 1px solid #e3e9f0;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.3s ease;
        }
        
        .feature-button:hover { background-color: #e3e9f0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
        
        /* 底部Tab区样式 */
        .tab-section { margin-top: 30px; }
        
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        
        /* Tab按钮样式 */
        .tab-button {
            background-color: rgba(31,35,41,0.10);
            color: #1F2329;
            border: none;
            height: 28px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            line-height: 28px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .tab-button:hover { background-color: rgba(31,35,41,0.06); color: #1F2329; }
        .tab-button.active { background-color: rgba(20, 86, 240, 0.2); color: #1456F0; }
        
        /* 图片容器基础样式 */
        .image-container {
            position: relative;
            width: 100%;
            max-height: 600px;
            margin: 0;
            background-color: #F2F3F5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        
        /* 日志审计页：图片容器需要固定比例，避免高度塌陷（图片为 absolute 定位） */
        .tab-content .image-container {
            aspect-ratio: 1.6/1;
            min-height: 360px;
        }
        
        .step-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin: 0;
            z-index: 1;
        }
        
        .step-image.active { opacity: 1 !important; }
        
        /* 热区容器 - 保持覆盖整个图片容器 */
        .hotspots-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        /* 热区样式 */
        .hotspot {
            position: absolute;
            width: clamp(44px, 6vw, 80px);
            height: clamp(44px, 6vw, 80px);
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            display: none;
            transform-origin: center center;
        }
        
        /* 使用伪元素实现脉冲效果，避免与transform冲突 */
        .hotspot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(0, 96, 255, 0.3);
            border: 2px solid rgba(0, 96, 255, 0.8);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        /* 脉冲动画 */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        
        /* 导航点样式 */
        .step-indicators {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
            gap: 15px;
            z-index: 10;
        }
        
        /* 管理员配置的导航点容器显示 */
        .admin-indicators { display: flex; }
        
        .step-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .step-indicator.active { background-color: #0762f7; }
        
        /* 两步验证双图片样式 */
        /* 确保容器能同时适应宽度和高度 */
        .two-factor-images {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        /* 两步验证交互版本样式 */
        /* 调整整体容器的边距和对齐方式 */
        .two-factor-images.interactive {
            margin: 0 !important; /* 去掉上下边距 */
            padding: 0 !important; /* 确保内部元素无内边距 */
            justify-content: center; /* 水平对齐方式 */
            align-items: center; /* 垂直对齐方式 */
            width: 100% !important; /* 确保占据全部宽度 */
            box-sizing: border-box !important; /* 确保内边距和边框不影响宽度计算 */
        }
        
        /* 确保h1和tabs之间的间距为20px */
        .main-title + .tab-section { margin-top: 20px !important; }
        
        /* 顶部区域样式 */
        .top-section { }
        
        /* 中间内容区样式 */
        .content-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px !important;
            background-color: #fff;
            border-radius: 12px;
            border: 1px solid #e3e9f0;
            overflow: hidden;
        }
        
        /* Tab内容样式 - 移除边框，避免与content-section的边框形成双层 */
        .content-section .tab-content {
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <header class="fixed-header">
        <div class="header-title">飞书安全功能总览</div>
        <img class="header-logo" src="feishu-security-logo.svg" alt="Logo" />
    </header>
<div class="log-audit-container">
        <!-- 内容部分 -->
        <!-- 顶部标题区 -->
        <div class="top-section">

    </div>
    
    <!-- 新增小tab切换器的CSS样式 -->
    <style>
        /* Tab内容样式 */
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px 20px 0 20px;
            box-sizing: border-box;
            text-align: center;
            background-color: #fff;
            /* 移除边框，避免与content-section的边框形成双层 */
            border-radius: 12px;
        }
        
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        /* Tab内部标题和描述 */
        .tab-inner-title {
            font-size: 16px;
            font-weight: 600;
            color: #1F2329;
            margin-bottom: 6px;
            margin-top: 0;
            text-align: left;
        }
        
        .tab-inner-description {
            font-size: 14px;
            line-height: 1.6;
            color: #646A73;
            margin-bottom: 20px;
            margin-top: 0;
            text-align: left;
        }
        
        /* 小tab切换器样式 - 按钮容器 */
        .sub-tab-container {
            display: inline-flex;
            gap: 0;
            margin-bottom: 20px;
            margin-top: 0;
            background-color: #F3F4F6;
            border-radius: 6px;
            padding: 1px;
            overflow: hidden;
            width: max-content;
            height: 32px;
            align-items: center;
        }
        
        .sub-tab-button {
            background-color: transparent;
            color: #6B7280;
            border: none;
            padding: 0 12px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            line-height: 32px;
            transition: all 0.2s ease;
        }
        
        .sub-tab-button:hover { background-color: rgba(0,0,0,0.02); color: #4B5563; }
        
        .sub-tab-button.active {
            background-color: #FFFFFF;
            color: #1F2937;
            border: none;
            box-shadow: inset 0 0 0 1px #D1D5DB, 0 1px 2px rgba(0,0,0,0.04);
            border-radius: 6px;
        }
        
        /* 小tab内容样式 */
        .sub-tab-content {
            display: none;
            margin-bottom: 0;
        }
        
        .sub-tab-content.active { display: block; }
    </style>
    
    <script>
        // 初始化主标签
        function initTabs() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            // 首次初始化：只展示 active 的内容
            tabContents.forEach(content => {
                const isActive = content.classList.contains('active');
                content.style.opacity = isActive ? '1' : '0';
            });
            
            // 添加标签切换事件
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTab = button.dataset.tab;
                    
                    // 更新按钮状态
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // 更新内容显示
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        content.style.opacity = '0';
                        if (content.id === `content-${targetTab}`) {
                            content.classList.add('active');
                            // 初始化当前标签页的子标签（如果存在）
                            initSubTabs(content);
                            // 重置为第 1 步，保证默认展示一致
                            switchImage(content, '1');
                            setTimeout(() => {
                                content.style.opacity = '1';
                            }, 10);
                        }
                    });
                });
            });
        }
        
        // 初始化子标签
        function initSubTabs(tabContent) {
            if (!tabContent) return;
            if (tabContent.dataset && tabContent.dataset.subTabsInited === '1') return;

            const subTabButtons = tabContent.querySelectorAll('.sub-tab-button');
            const subTabContents = tabContent.querySelectorAll('.sub-tab-content');

            if (subTabButtons.length === 0 || subTabContents.length === 0) return;

            tabContent.dataset.subTabsInited = '1';
            
            // 添加子标签切换事件
            subTabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetSubTab = button.dataset.subTab;
                    
                    // 更新按钮状态
                    subTabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // 更新内容显示
                    subTabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `sub-content-${targetSubTab}`) {
                            content.classList.add('active');
                        }
                    });
                });
            });
        }
        
        // 初始化所有子标签
        function initAllSubTabs() {
            document.querySelectorAll('.tab-content').forEach(initSubTabs);
        }
        
        // 初始化图片切换
        function initImageSwitching() {
            const allTabContents = document.querySelectorAll('.tab-content');
            
            allTabContents.forEach(content => {
                // 为热区添加点击事件
                const hotspots = content.querySelectorAll('.hotspot');
                hotspots.forEach(hotspot => {
                    hotspot.addEventListener('click', () => {
                        const nextStep = hotspot.dataset.nextStep;
                        const currentContent = hotspot.closest('.sub-tab-content') || hotspot.closest('.tab-content');
                        
                        if (currentContent && nextStep) {
                            switchImage(currentContent, nextStep);
                        }
                    });
                });
                
                // 为导航点添加点击事件
                const stepIndicators = content.querySelectorAll('.step-indicator');
                stepIndicators.forEach(indicator => {
                    indicator.addEventListener('click', () => {
                        const step = indicator.dataset.step;
                        const currentContent = indicator.closest('.sub-tab-content') || indicator.closest('.tab-content');
                        
                        if (currentContent && step) {
                            switchImage(currentContent, step);
                        }
                    });
                });
            });
        }
        
        // 切换图片
        function switchImage(contentEl, step) {
            if (!contentEl) return;

            // 更新图片显示
            const stepImages = contentEl.querySelectorAll('.step-image');
            if (!stepImages || stepImages.length === 0) return;
            stepImages.forEach(img => {
                img.classList.remove('active');
                if (img.dataset.step === step) {
                    img.classList.add('active');
                }
            });
            
            // 更新指示器状态
            const stepIndicators = contentEl.querySelectorAll('.step-indicator');
            stepIndicators.forEach(indicator => {
                indicator.classList.remove('active');
                if (indicator.dataset.step === step) {
                    indicator.classList.add('active');
                }
            });
            
            // 更新热区显示
            const hotspots = contentEl.querySelectorAll('.hotspot');
            hotspots.forEach(hotspot => {
                hotspot.style.display = hotspot.dataset.step === step ? 'block' : 'none';
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 支持从首页标签跳转：log-audit-detail.html?tab=admin-logs
            try {
                const params = new URLSearchParams(window.location.search);
                const tab = params.get('tab');
                if (tab) {
                    const btn = document.querySelector(`.tab-button[data-tab="${CSS.escape(tab)}"]`);
                    if (btn) btn.click();
                }
            } catch (e) {
                // ignore
            }

            initTabs();
            initAllSubTabs();
            initImageSwitching();
        });
    </script>
<script src="process-end-popup.js"></script>
<script src="hotspot-debug.js"></script>
</body>
</html>
